<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pokedex</title>
    <link rel="stylesheet" href="Styles.css">
    <script src="Script.js" defer></script>
</head>
<body>

    <!--Whos that pokemon?-->
    <button id="guess"></button>
    <div>
        <div class="whosPoke">
            <span class="cerrar">&times;</span>
            <img id="background" src="">
            <img id="guesspoke" src="">
            <button class="Opcion" id="op1"></button>
            <button class="Opcion" id="op2"></button>
            <button class="Opcion" id="op3"></button>
            <button class="Opcion" id="op4"></button>
        </div>
    </div>

    <h1>Pokedex</h1>
    <input id="buscarPokemon" placeholder="Filtra un Pokémon...">
    <div id="contenedorPokemones" class="pokemon-grid" onclick="OnclickInfoPoke()"></div>
    <h3 id="loader" style="text-align: center;">Cargando más Pokémones...</h3>
    <h3 id="aviso" style="text-align: center;">Ya no hay más Pokémones con esas caracteristicas</h3> 

</body>
</html>
